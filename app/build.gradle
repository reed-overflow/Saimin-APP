apply plugin: 'com.android.application'

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.reedoverflow.saiminapp"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 3
        versionName "0.1.2b"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (System.getenv('RELEASE_KEYSTORE_PATH')) {
            ciRelease {
                storeFile file(System.getenv('RELEASE_KEYSTORE_PATH'))
                storePassword System.getenv('RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('RELEASE_KEYSTORE_PATH')) {
                signingConfig signingConfigs.ciRelease
            } else if (System.getenv('CI_TEST_SIGNING') == 'true') {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildToolsVersion '33.0.0'

}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.navigation:navigation-fragment:2.1.0'
    implementation 'androidx.navigation:navigation-ui:2.1.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.1.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.1.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'androidx.preference:preference:1.1.1'

//    LicensesDialog
    implementation 'de.psdev.licensesdialog:licensesdialog:2.1.0'

    implementation 'com.kyleduo.switchbutton:library:2.0.0'

    implementation 'com.xw.repo:bubbleseekbar:3.20-lite'

    implementation 'com.wuyr:rippleanimation:1.0.0'

}
